[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdeai-shared"
version = "0.1.0"
description = "VerdeAI shared library"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "motor~=3.6",
    "aio-pika~=9.4",
    "pydantic~=2.9",
    "pydantic-settings~=2.6",
    "python-keycloak~=4.4",
    "pyjwt[crypto]~=2.9",
    "loguru~=0.7",
    "opentelemetry-sdk~=1.27",
    "opentelemetry-instrumentation-fastapi",
    "langfuse~=2.50",
    "httpx~=0.27",
    "redis[asyncio]~=5.0",
    "voyageai~=0.3",
    "bm25s~=0.2",
    "jinja2~=3.1",
    "openai~=1.0",
    "langchain-text-splitters~=0.3",
    "tiktoken~=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["verdeai_shared"]
