[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdeai-gap-analyzer"
version = "0.1.0"
description = "VerdeAI Gap Analyzer worker"
requires-python = ">=3.12"
dependencies = [
    "verdeai-shared",
    "motor~=3.6",
    "redis[asyncio]~=5.0",
    "aio-pika~=9.4",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langfuse>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# pytest treats this file as rootdir when the suite is run from the service directory (which is
# how it runs in-container), so markers must be registered here as well as at the repo root.
markers = [
    "llm: makes real, billed LLM API calls — also guarded by RUN_LLM_TESTS=1",
]
