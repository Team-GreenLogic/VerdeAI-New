[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdeai-api-gateway"
version = "0.1.0"
description = "VerdeAI API Gateway service"
requires-python = ">=3.12"
dependencies = [
    "verdeai-shared",
    "fastapi~=0.115",
    "pydantic[email]~=2.9",
    "uvicorn[standard]~=0.32",
    "python-multipart~=0.0.12",
    "redis[asyncio]~=5.0",
    "httpx~=0.27",
    "motor~=3.6",
    "aio-pika~=9.4",
    "jinja2~=3.1",
    "weasyprint~=63.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
