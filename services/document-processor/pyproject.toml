[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdeai-document-processor"
version = "0.1.0"
description = "VerdeAI Document Processor worker"
requires-python = ">=3.12"
dependencies = [
    "verdeai-shared",
    "llama-cloud~=2.4",
    "imagehash~=4.3",
    "fastcdc~=1.5",
    "pillow~=11.0",
    "motor~=3.6",
    "redis[asyncio]~=5.0",
    "aio-pika~=9.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
