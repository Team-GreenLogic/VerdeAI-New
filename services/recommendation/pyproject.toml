[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdeai-recommendation"
version = "0.1.0"
description = "VerdeAI Recommendation worker"
requires-python = ">=3.12"
dependencies = [
    "verdeai-shared",
    "dramatiq[rabbitmq]~=1.17",
    "langgraph~=0.2",
    "langchain-core~=0.3",
    "motor~=3.6",
    "aio-pika~=9.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
