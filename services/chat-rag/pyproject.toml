[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdeai-chat-rag"
version = "0.1.0"
description = "VerdeAI Chat RAG service"
requires-python = ">=3.12"
dependencies = [
    "verdeai-shared",
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "sse-starlette~=2.1",
    "motor~=3.6",
    "redis[asyncio]~=5.0",
    "httpx~=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
