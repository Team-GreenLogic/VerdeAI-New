[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdeai-iso-knowledge"
version = "0.1.0"
description = "VerdeAI ISO Knowledge worker"
requires-python = ">=3.12"
dependencies = [
    "verdeai-shared",
    "motor~=3.6",
    "langgraph>=0.2",
    "llama-cloud~=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
