<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 700" role="img" aria-label="Eleven-step pipeline: company documents are deduplicated, parsed, chunked with AI-written context, and had their diagrams captioned, then embedded into a combined vector and keyword index. Per ISO 14001 clause, the system hybrid-retrieves evidence, reranks it, compares the organisation's declared state against the clause requirement, and reasons over the gap with an LLM chain of thought, looping back for the next clause. The final gap report lists Met, Partially Met, Not Met, or Insufficient Evidence for every clause, each with cited evidence.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4D5D4F"></path>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E8068"></path>
    </marker>
  </defs>

  <g font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" fill="#17241B">

    <text x="40" y="60" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#4D5D4F" letter-spacing="0.16em">VERDEAI &#8212; DOCUMENT-TO-GAP-REPORT PIPELINE</text>

    <g stroke="#4D5D4F" fill="none">
      <!-- row 1 arrows -->
      <line x1="245" y1="225" x2="262" y2="225" marker-end="url(#arrow)"></line>
      <line x1="475" y1="225" x2="492" y2="225" marker-end="url(#arrow)"></line>
      <line x1="705" y1="225" x2="722" y2="225" marker-end="url(#arrow)"></line>
      <line x1="935" y1="225" x2="952" y2="225" marker-end="url(#arrow)"></line>
      <line x1="1165" y1="225" x2="1182" y2="225" marker-end="url(#arrow)"></line>
      <!-- bend -->
      <line x1="1292.5" y1="300" x2="1292.5" y2="382" marker-end="url(#arrow)"></line>
      <!-- row 2 arrows (right to left) -->
      <line x1="1190" y1="465" x2="1173" y2="465" marker-end="url(#arrow)"></line>
      <line x1="960" y1="465" x2="943" y2="465" marker-end="url(#arrow)"></line>
      <line x1="730" y1="465" x2="713" y2="465" marker-end="url(#arrow)"></line>
      <line x1="500" y1="465" x2="483" y2="465" marker-end="url(#arrow)"></line>
    </g>

    <!-- loop-back arrow: Analyse Gap -> Hybrid Retrieve, next clause -->
    <path d="M 602.5 540 C 602.5 608, 1292.5 608, 1292.5 540" fill="none" stroke="#6E8068" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-loop)"></path>
    <text x="947.5" y="622" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#6E8068" font-weight="600">next clause &#8635;</text>

    <!-- numbered circles -->
    <g font-size="11.5" font-weight="700" text-anchor="middle" fill="#2F5C3F">
      <circle cx="70" cy="180" r="13" fill="#FFFFFF" stroke="#2F5C3F"></circle><text x="70" y="184">1</text>
      <circle cx="300" cy="180" r="13" fill="#FFFFFF" stroke="#2F5C3F"></circle><text x="300" y="184">2</text>
      <circle cx="530" cy="180" r="13" fill="#FFFFFF" stroke="#2F5C3F"></circle><text x="530" y="184">3</text>
      <circle cx="760" cy="180" r="13" fill="#FFFFFF" stroke="#2F5C3F"></circle><text x="760" y="184">4</text>
      <circle cx="990" cy="180" r="13" fill="#FFFFFF" stroke="#2F5C3F"></circle><text x="990" y="184">5</text>
      <circle cx="1220" cy="180" r="13" fill="#FFFFFF" stroke="#2F5C3F"></circle><text x="1220" y="184">6</text>
      <circle cx="1220" cy="420" r="13" fill="#FFFFFF" stroke="#2F5C3F"></circle><text x="1220" y="424">7</text>
      <circle cx="990" cy="420" r="13" fill="#FFFFFF" stroke="#2F5C3F"></circle><text x="990" y="424">8</text>
      <circle cx="760" cy="420" r="13" fill="#FFFFFF" stroke="#2F5C3F"></circle><text x="760" y="424">9</text>
      <circle cx="530" cy="420" r="13" fill="#FFFFFF" stroke="#2F5C3F"></circle><text x="530" y="424">10</text>
      <circle cx="300" cy="420" r="13" fill="#FFFFFF" stroke="#2F5C3F"></circle><text x="300" y="424">11</text>
    </g>

    <!-- row 1: ingestion + indexing -->
    <rect x="40" y="150" width="205" height="150" rx="16" fill="#BAD6EA" stroke="#A9B8A1"></rect>
    <text x="142.5" y="228" text-anchor="middle" font-size="14" font-weight="700">Company Documents</text>
    <text x="142.5" y="250" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">PDF &#183; DOCX uploads</text>

    <rect x="270" y="150" width="205" height="150" rx="16" fill="#9FDAD0" stroke="#A9B8A1"></rect>
    <text x="372.5" y="228" text-anchor="middle" font-size="14" font-weight="700">Dedup Check</text>
    <text x="372.5" y="250" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">skip repeats, flag changes</text>

    <rect x="500" y="150" width="205" height="150" rx="16" fill="#BFE3C7" stroke="#A9B8A1"></rect>
    <text x="602.5" y="228" text-anchor="middle" font-size="14" font-weight="700">Parse &amp; Structure</text>
    <text x="602.5" y="250" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">text, tables, figures</text>

    <rect x="730" y="150" width="205" height="150" rx="16" fill="#F3E2A8" stroke="#A9B8A1"></rect>
    <text x="832.5" y="228" text-anchor="middle" font-size="14" font-weight="700">Chunk + Context</text>
    <text x="832.5" y="250" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">overlap chunks + AI preamble</text>

    <rect x="960" y="150" width="205" height="150" rx="16" fill="#F0C89C" stroke="#A9B8A1"></rect>
    <text x="1062.5" y="228" text-anchor="middle" font-size="14" font-weight="700">Caption Diagrams</text>
    <text x="1062.5" y="250" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">vision AI describes figures</text>

    <rect x="1190" y="150" width="205" height="150" rx="16" fill="#F3B8A8" stroke="#A9B8A1"></rect>
    <text x="1292.5" y="228" text-anchor="middle" font-size="14" font-weight="700">Embed + Index</text>
    <text x="1292.5" y="250" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">vector + keyword index</text>

    <!-- row 2: per-clause gap analysis (right to left) -->
    <rect x="1190" y="390" width="205" height="150" rx="16" fill="#F0C9CE" stroke="#A9B8A1"></rect>
    <text x="1292.5" y="468" text-anchor="middle" font-size="14" font-weight="700">Hybrid Retrieve</text>
    <text x="1292.5" y="490" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">vector + keyword, fused</text>

    <rect x="960" y="390" width="205" height="150" rx="16" fill="#E3C2E0" stroke="#A9B8A1"></rect>
    <text x="1062.5" y="468" text-anchor="middle" font-size="14" font-weight="700">Rerank Evidence</text>
    <text x="1062.5" y="490" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">AI keeps strongest matches</text>

    <rect x="730" y="390" width="205" height="150" rx="16" fill="#CBB9E8" stroke="#A9B8A1"></rect>
    <text x="832.5" y="468" text-anchor="middle" font-size="14" font-weight="700">Compare State</text>
    <text x="832.5" y="490" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">org profile vs clause rule</text>

    <rect x="500" y="390" width="205" height="150" rx="16" fill="#C2CBEF" stroke="#A9B8A1"></rect>
    <text x="602.5" y="468" text-anchor="middle" font-size="14" font-weight="700">Analyse Gap (LLM)</text>
    <text x="602.5" y="490" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">chain-of-thought reasoning</text>

    <rect x="270" y="390" width="205" height="150" rx="16" fill="#2F5C3F" stroke="#A9B8A1"></rect>
    <text x="372.5" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#F6F8F2">Gap Report</text>
    <text x="372.5" y="485" text-anchor="middle" font-size="10.5" font-weight="500" fill="#F6F8F2">aggregated per clause</text>
    <text x="372.5" y="504" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="9.5" fill="#F6F8F2">with cited evidence</text>

    <!-- decision-outcome legend (unnumbered — not a pipeline step) -->
    <rect x="40" y="390" width="205" height="150" rx="16" fill="none" stroke="#A9B8A1" stroke-dasharray="3 5"></rect>
    <text x="142.5" y="414" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="9.5" letter-spacing="0.08em" fill="#4D5D4F">DECISION OUTCOMES</text>

    <rect x="55" y="426" width="175" height="22" rx="11" fill="#BFE3C7"></rect>
    <text x="142.5" y="441" text-anchor="middle" font-size="10" font-weight="600">Met</text>

    <rect x="55" y="454" width="175" height="22" rx="11" fill="#F3E2A8"></rect>
    <text x="142.5" y="469" text-anchor="middle" font-size="10" font-weight="600">Partially Met</text>

    <rect x="55" y="482" width="175" height="22" rx="11" fill="#F0C9CE"></rect>
    <text x="142.5" y="497" text-anchor="middle" font-size="10" font-weight="600">Not Met</text>

    <rect x="55" y="510" width="175" height="22" rx="11" fill="#D8DCE6"></rect>
    <text x="142.5" y="525" text-anchor="middle" font-size="10" font-weight="600">Insufficient Evidence</text>

    <text x="730" y="660" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#4D5D4F">steps 7&#8211;10 repeat until every ISO 14001 clause has been evaluated</text>
  </g>
</svg>
