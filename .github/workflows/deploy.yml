name: Deploy to EC2

on:
  push:
    branches: [release]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::368310206647:role/verdeai-gha-deploy-role
  EC2_INSTANCE_ID: i-0c0e51a4d6af94bd9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "VerdeAI release deploy (${{ github.sha }})" \
            --parameters 'commands=["/opt/verdeai/deploy.sh"]' \
            --timeout-seconds 1200 \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $COMMAND_ID"

      - name: Wait for deploy to finish
        run: |
          # A full image rebuild (e.g. after a shared/ package change) can take
          # well over the ~100s the built-in `ssm wait` waiter allows, so poll
          # manually with a longer budget instead.
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.deploy.outputs.command_id }}" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query "Status" --output text)
            echo "poll $i: $STATUS"
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi

